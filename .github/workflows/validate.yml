name: Data, model and browser checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate data and model
        run: |
          python3 scripts/validate_data.py
          node --check scripts/app.js
          node tests/model.test.cjs
          python3 scripts/build.py
          git diff --exit-code -- index.html
          python3 tests/backtest.py
          git diff --exit-code -- tests/backtest-summary.json tests/backtest-results.csv
      - name: Install browser for UI checks
        run: |
          python3 -m pip install playwright==1.56.0
          python3 -m playwright install --with-deps chromium
      - name: Exercise desktop and mobile
        run: python3 tests/smoke.py
